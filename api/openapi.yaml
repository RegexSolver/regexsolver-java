      x-content-type: application/json
      x-accepts:
      - application/json
  /compute/union:
    post:
      description: Compute the union of the given terms.
      operationId: union
      requestBody:
        content:
          application/json:
            example:
              terms:
              - type: regex
                value: ab
              - type: regex
                value: cd
              - type: regex
                value: ef
              options:
                schemaVersion: 1
                response:
                  format: regex
            schema:
              $ref: "#/components/schemas/MultiTermsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: regex
                  value: (ab|cd|ef)
              schema:
                $ref: "#/components/schemas/concat_200_response"
          description: Union term.
        "400":
          content:
            application/json:
