                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Repeat
      tags:
