openapi: 3.0.3
info:
  title: RegexSolver
  version: 1.1.0
servers:
- url: https://api.regexsolver.com/v1
security:
- BearerAuth: []
tags:
- description: "Inspect properties of a term, such as cardinality, length, or equivalence."
  name: Analyze
- description: Derive new terms from one or more input terms.
  name: Compute
- description: Produce concrete output from a term.
  name: Generate
paths:
  /analyze/cardinality:
    post:
      description: Compute how many strings the term matches.
      operationId: cardinality
      requestBody:
        content:
          application/json:
            example:
              term:
                type: regex
                value: "[a-z]"
            schema:
              $ref: "#/components/schemas/TermRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: integer
                  value: 26
              schema:
                $ref: "#/components/schemas/cardinality_200_response"
          description: Cardinality result.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Cardinality
      tags:
      - Analyze
      x-content-type: application/json
      x-accepts:
      - application/json
  /analyze/dot:
    post:
      description: Build a Graphviz DOT representation of the term's automaton.
      operationId: dot
      requestBody:
        content:
          application/json:
            example:
              term:
                type: regex
                value: "[a-z]"
            schema:
              $ref: "#/components/schemas/TermRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: string
                  value: "digraph Automaton {\n\trankdir = LR;\n\t0\t[shape=circle,label=\"\
                    0\"];\n\tinitial [shape=plaintext,label=\"\"];\n\tinitial -> 0\n\
                    \t0 -> 1 [label=\"[a-z]\"]\n\t1\t[shape=doublecircle,label=\"\
                    1\"];\n}"
              schema:
                $ref: "#/components/schemas/dot_200_response"
          description: Graphviz DOT representation.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Graphviz DOT
      tags:
      - Analyze
      x-content-type: application/json
      x-accepts:
      - application/json
  /analyze/empty:
    post:
      description: Check if the term matches no strings.
      operationId: empty
      requestBody:
        content:
          application/json:
            example:
              term:
                type: regex
                value: "[]"
            schema:
              $ref: "#/components/schemas/TermRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: boolean
                  value: true
              schema:
                $ref: "#/components/schemas/empty_200_response"
          description: Empty language result.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Empty
      tags:
      - Analyze
      x-content-type: application/json
      x-accepts:
      - application/json
  /analyze/empty_string:
    post:
      description: Check if the term matches only the empty string.
      operationId: empty_string
      requestBody:
        content:
          application/json:
            example:
              term:
                type: regex
                value: ""
            schema:
              $ref: "#/components/schemas/TermRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: boolean
                  value: true
              schema:
                $ref: "#/components/schemas/empty_200_response"
          description: Empty string only result.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Empty String Only
      tags:
      - Analyze
      x-content-type: application/json
      x-accepts:
      - application/json
  /analyze/total:
    post:
      description: Check if the term matches all the possible strings.
      operationId: total
      requestBody:
        content:
          application/json:
            example:
              term:
                type: regex
                value: .*
            schema:
              $ref: "#/components/schemas/TermRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: boolean
                  value: true
              schema:
                $ref: "#/components/schemas/empty_200_response"
          description: Totality result.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Totality
      tags:
      - Analyze
      x-content-type: application/json
      x-accepts:
      - application/json
  /analyze/deterministic:
    post:
      description: Check if the term's automaton is deterministic. Only a deterministic
        FAIR guarantees consistent string ordering across paginated /generate/strings
        requests; call /compute/determinize first if this is false.
      operationId: deterministic
      requestBody:
        content:
          application/json:
            example:
              term:
                type: fair
                value: "<uw$8AJYkaU].HFn1kT[tx*-VAZ8usSKXcEKZ[wx:F8vYuR-b?tFFk1eM2RXs9yuu5dakz7r/{!AW9/(hK0]knHS&Q]!@K=ahmGr1Dbjb5(XE1UT%Ab@8rXvYop}$"
            schema:
              $ref: "#/components/schemas/TermRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: boolean
                  value: true
              schema:
                $ref: "#/components/schemas/empty_200_response"
          description: Determinism result.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Deterministic
      tags:
      - Analyze
      x-content-type: application/json
      x-accepts:
      - application/json
  /analyze/equivalent:
    post:
      description: Check if the two terms accept exactly the same language.
      operationId: equivalent
      requestBody:
        content:
          application/json:
            example:
              terms:
              - type: regex
                value: (abcd|abef)
              - type: regex
                value: ab(cd|ef)
            schema:
              $ref: "#/components/schemas/TwoTermsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: boolean
                  value: true
              schema:
                $ref: "#/components/schemas/empty_200_response"
          description: Language equivalence result.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Equivalent
      tags:
      - Analyze
      x-content-type: application/json
      x-accepts:
      - application/json
  /analyze/length:
    post:
      description: Compute the minimum and maximum length of strings matched by the
        term.
      operationId: length
      requestBody:
        content:
          application/json:
            example:
              term:
                type: regex
                value: (abc)?d
            schema:
              $ref: "#/components/schemas/TermRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: length
                  min: 1
                  max: 4
              schema:
                $ref: "#/components/schemas/length_200_response"
          description: Length bounds.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Length
      tags:
      - Analyze
      x-content-type: application/json
      x-accepts:
      - application/json
  /analyze/pattern:
    post:
      description: Return a regular expression pattern that represents the term.
      operationId: pattern
      requestBody:
        content:
          application/json:
            example:
              term:
                type: fair
                value: "<uw$8AJYkaU].HFn1kT[tx*-VAZ8usSKXcEKZ[wx:F8vYuR-b?tFFk1eM2RXs9yuu5dakz7r/{!AW9/(hK0]knHS&Q]!@K=ahmGr1Dbjb5(XE1UT%Ab@8rXvYop}$"
            schema:
              $ref: "#/components/schemas/TermRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: string
                  value: deabc
              schema:
                $ref: "#/components/schemas/dot_200_response"
          description: Regular expression pattern.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Pattern
      tags:
      - Analyze
      x-content-type: application/json
      x-accepts:
      - application/json
  /analyze/subset:
    post:
      description: Check if the first term's language is a subset of the second term's
        language.
      operationId: subset
      requestBody:
        content:
          application/json:
            example:
              terms:
              - type: regex
                value: de
              - type: regex
                value: (abc|de)
            schema:
              $ref: "#/components/schemas/TwoTermsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: boolean
                  value: true
              schema:
                $ref: "#/components/schemas/empty_200_response"
          description: Subset result.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Subset
      tags:
      - Analyze
      x-content-type: application/json
      x-accepts:
      - application/json
  /compute/concat:
    post:
      description: Concatenate the given terms in order.
      operationId: concat
      requestBody:
        content:
          application/json:
            example:
              terms:
              - type: regex
                value: ab
              - type: regex
                value: c.*
              - type: regex
                value: .*de
              options:
                schemaVersion: 1
                response:
                  format: regex
            schema:
              $ref: "#/components/schemas/MultiTermsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: regex
                  value: abc.*de
              schema:
                $ref: "#/components/schemas/concat_200_response"
          description: Concatenated term.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Concatenation
      tags:
      - Compute
      x-content-type: application/json
      x-accepts:
      - application/json
  /compute/difference:
    post:
      description: Compute the difference between the two given terms.
      operationId: difference
      requestBody:
        content:
          application/json:
            example:
              terms:
              - type: regex
                value: (ab|cd)
              - type: regex
                value: cd
              options:
                schemaVersion: 1
                response:
                  format: regex
            schema:
              $ref: "#/components/schemas/TwoTermsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: regex
                  value: ab
              schema:
                $ref: "#/components/schemas/concat_200_response"
          description: Difference term.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Difference
      tags:
      - Compute
      x-content-type: application/json
      x-accepts:
      - application/json
  /compute/intersection:
    post:
      description: Compute the intersection of the given terms.
      operationId: intersection
      requestBody:
        content:
          application/json:
            example:
              terms:
              - type: regex
                value: (ab|cd|ef)
              - type: regex
                value: (ab|cd)
              - type: regex
                value: (cd|ef)
              options:
                schemaVersion: 1
                response:
                  format: regex
            schema:
              $ref: "#/components/schemas/MultiTermsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: regex
                  value: cd
              schema:
                $ref: "#/components/schemas/concat_200_response"
          description: Intersection term.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Intersection
      tags:
      - Compute
      x-content-type: application/json
      x-accepts:
      - application/json
  /compute/repeat:
    post:
      description: Repeat a term between `min` and `max` times.
      operationId: repeat
      requestBody:
        content:
          application/json:
            example:
              term:
                type: regex
                value: abc
              min: 3
              options:
                schemaVersion: 1
                response:
                  format: regex
            schema:
              $ref: "#/components/schemas/RepeatRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: regex
                  value: "(abc){3,}"
              schema:
                $ref: "#/components/schemas/concat_200_response"
          description: Repeated term.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
