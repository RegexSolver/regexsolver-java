          description: Internal server error
      summary: Union
      tags:
      - Compute
      x-content-type: application/json
      x-accepts:
      - application/json
  /compute/complement:
    post:
      description: Compute the complement of the given term.
      operationId: complement
      requestBody:
        content:
          application/json:
            example:
              term:
