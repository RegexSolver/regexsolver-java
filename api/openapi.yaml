      x-content-type: application/json
      x-accepts:
      - application/json
  /compute/determinize:
    post:
      description: Compute a deterministic FAIR.
      operationId: determinize
      requestBody:
        content:
          application/json:
            example:
              term:
                type: regex
                value: .*abc
            schema:
              $ref: "#/components/schemas/TermRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: fair
                  value: "<uw$8AJYkaU].HFn1kT[tx*-VAZ8usSKXcEKZ[wx:F8vYuR-b?tFFk1eM2RXs9yuu5dakz7r/{!AW9/(hK0]knHS&Q]!@K=ahmGr1Dbjb5(XE1UT%Ab@8rXvYop}$"
                  metadata:
                    deterministic: true
              schema:
                $ref: "#/components/schemas/concat_200_response"
          description: Deterministic FAIR.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Determinize
      tags:
      - Compute
      x-content-type: application/json
      x-accepts:
      - application/json
  /generate/strings:
    post:
      description: "Generate up to `limit` distinct strings matched by `term`, skipping\
        \ the first `offset` strings. Strings are only guaranteed to be distinct within\
        \ a single call; pagination across calls is only consistent (no repeats or\
        \ gaps) if `term` is deterministic. Call `/analyze/deterministic` to check,\
        \ and `/compute/determinize` first if needed."
      operationId: strings
      requestBody:
        content:
          application/json:
            example:
              term:
                type: regex
                value: "(abc|de){2}"
              limit: 10
              offset: 0
            schema:
              $ref: "#/components/schemas/GenerateStringsRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: generatedStrings
                  strings:
                    type: strings
                    value:
                    - abcabc
                    - abcde
                    - deabc
                    - dede
              schema:
                $ref: "#/components/schemas/strings_200_response"
          description: Generated strings.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Too many requests
          headers:
            Retry-After:
              description: Number of seconds to wait before retrying.
              explode: false
              schema:
                type: integer
              style: simple
        "500":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Internal server error
      summary: Strings
      tags:
      - Generate
      x-content-type: application/json
      x-accepts:
      - application/json
components:
  responses:
    Error400:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse400"
      description: Bad request
    Error401:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse401"
      description: Unauthorized
    Error403:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse403"
      description: Forbidden
    Error404:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Not found
    Error429:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Too many requests
      headers:
        Retry-After:
          description: Number of seconds to wait before retrying.
          explode: false
          schema:
            type: integer
          style: simple
    Error500:
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
      description: Internal server error
  schemas:
    Boolean:
      description: Wrapper for a boolean value.
      example:
        type: boolean
        value: true
      properties:
        type:
          enum:
          - boolean
          type: string
        value:
          description: Boolean value.
          type: boolean
      required:
      - type
      - value
      type: object
    Cardinality:
      description: Number of unique strings matched by a term.
      discriminator:
        mapping:
          infinite: "#/components/schemas/CardinalityInfinite"
          bigInteger: "#/components/schemas/CardinalityBigInteger"
          integer: "#/components/schemas/CardinalityInteger"
        propertyName: type
      oneOf:
      - $ref: "#/components/schemas/CardinalityInfinite"
      - $ref: "#/components/schemas/CardinalityBigInteger"
      - $ref: "#/components/schemas/CardinalityInteger"
    CardinalityInfinite:
      description: The set of matched strings is infinite.
      example:
        type: infinite
      properties:
        type:
          enum:
          - infinite
          type: string
      required:
      - type
      type: object
    CardinalityBigInteger:
      description: The set of matched strings is finite but too large to be returned.
      example:
        type: bigInteger
      properties:
        type:
          enum:
          - bigInteger
          type: string
      required:
      - type
      type: object
    CardinalityInteger:
      description: The set of matched strings is finite.
      example:
        type: integer
        value: 26
      properties:
        type:
          enum:
          - integer
          type: string
        value:
          description: Exact count.
          format: int64
          minimum: 0
          type: integer
      required:
      - type
      - value
      type: object
    ErrorResponse:
      example:
        success: false
        errorCode: errorCode
        error: error
      properties:
        success:
          example: false
          type: boolean
        error:
          description: Human readable error message.
          type: string
        errorCode:
          description: The error code.
          type: string
      required:
      - error
      - success
      type: object
    ErrorResponse400:
      allOf:
      - $ref: "#/components/schemas/ErrorResponse"
      - properties:
          errorCode:
            enum:
            - InvalidJson
            - TooManyTerms
            - TimeoutTooLarge
            - TimeoutExceeded
            - InvalidNumberOfStringsToGenerate
            - AutomatonTooManyStates
            - RegexSyntaxError
            - FairSyntaxError
            type: string
        type: object
      example:
        success: false
        errorCode: InvalidJson
        error: error
    ErrorResponse401:
      allOf:
      - $ref: "#/components/schemas/ErrorResponse"
      - properties:
          errorCode:
            enum:
            - MissingOrMalformedToken
            - InvalidToken
            type: string
        type: object
      example:
        success: false
        errorCode: MissingOrMalformedToken
        error: error
    ErrorResponse403:
      allOf:
      - $ref: "#/components/schemas/ErrorResponse"
      - properties:
          errorCode:
            enum:
            - QuotaExceeded
            type: string
        type: object
      example:
        success: false
        errorCode: QuotaExceeded
        error: error
    GenerateStringsRequest:
      description: "Request to generate up to `limit` distinct strings matched by\
        \ `term`, skipping the first `offset` strings. For consistent pagination,\
        \ `term` should be deterministic."
      properties:
        term:
          allOf:
          - $ref: "#/components/schemas/Term"
          description: Source term to generate strings from.
        limit:
          description: Maximum number of unique strings to return.
          maximum: 100
          minimum: 1
          type: integer
        offset:
          description: Number of matched strings to skip before starting to collect
            the results. Used for pagination.
          minimum: 0
          type: integer
        options:
          $ref: "#/components/schemas/RequestOptions"
      required:
      - limit
      - offset
      - term
      type: object
    GenerateStringsResponse:
      description: Response containing distinct strings generated from the requested
        `term`.
      example:
        strings: ""
        type: generatedStrings
      properties:
        type:
          enum:
          - generatedStrings
          type: string
        strings:
          allOf:
          - $ref: "#/components/schemas/Strings"
          description: The generated distinct strings.
      required:
      - strings
      - type
      type: object
    Length:
      description: Minimum and maximum length of any string in the language.
      example:
        min: 0
        max: 6
        type: length
      properties:
        type:
          enum:
          - length
          type: string
        min:
          description: "Shortest possible length, or null if empty."
          nullable: true
          type: integer
        max:
          description: "Longest possible length, or null if unbounded."
          nullable: true
          type: integer
      required:
      - max
      - min
      - type
      type: object
    TermRequest:
      description: Request carrying a single term.
      properties:
        term:
          $ref: "#/components/schemas/Term"
        options:
          $ref: "#/components/schemas/RequestOptions"
      required:
      - term
      type: object
    MultiTermsRequest:
      description: Request carrying 2 or more terms for n-ary operations.
      properties:
        terms:
          description: Terms to process. Order matters for some operations.
          items:
            $ref: "#/components/schemas/Term"
          minItems: 2
          type: array
        options:
          $ref: "#/components/schemas/RequestOptions"
      required:
      - terms
      type: object
    RepeatRequest:
      description: Request to repeat a term between `min` and `max` times.
      properties:
        term:
          allOf:
          - $ref: "#/components/schemas/Term"
          description: Term to repeat.
        min:
          description: Inclusive lower bound of repetitions.
          minimum: 0
          type: integer
        max:
          description: "Inclusive upper bound. If omitted or null, the repetition\
            \ is unbounded."
          minimum: 0
          nullable: true
          type: integer
        options:
          $ref: "#/components/schemas/RequestOptions"
      required:
      - min
      - term
      type: object
    RequestOptions:
      description: Change how the engine handles the operation.
      properties:
        schemaVersion:
          description: Client-expected schema version.
          example: 1
          type: integer
        response:
          $ref: "#/components/schemas/ResponseOptions"
        execution:
          $ref: "#/components/schemas/ExecutionOptions"
      required:
      - schemaVersion
      type: object
    FairResponseOptions:
      description: Options controlling the FAIR output. Only applied when response
        format is "fair".
      properties:
        deterministic:
          description: "When true, the returned FAIR is guaranteed to be a deterministic\
            \ automaton, suitable for consistent pagination with /generate/strings."
          type: boolean
      type: object
    ResponseOptions:
      description: Change how the engine returns results.
      properties:
        format:
          description: Return format of the term.
          enum:
          - any
          - fair
          - regex
          type: string
        fair:
          allOf:
          - $ref: "#/components/schemas/FairResponseOptions"
          description: Options applied when format is "fair". Ignored otherwise.
      type: object
    ExecutionOptions:
      description: Change how the engine executes the operation.
      properties:
        timeout:
          description: Timeout in milliseconds for the operation.
          minimum: 1
          type: integer
      type: object
    String:
      description: Wrapper for a string value.
      example:
        type: string
        value: value
      properties:
        type:
          enum:
          - string
          type: string
        value:
          description: String value.
          type: string
      required:
      - type
      - value
      type: object
    Strings:
      description: Wrapper for a list of strings.
      properties:
        type:
          enum:
          - strings
          type: string
        value:
          description: Array of unique strings.
          items:
            type: string
          type: array
      required:
      - type
      - value
      type: object
    Term:
      description: Serialized term.
      discriminator:
        mapping:
          regex: "#/components/schemas/TermRegex"
          fair: "#/components/schemas/TermFair"
        propertyName: type
      oneOf:
      - $ref: "#/components/schemas/TermRegex"
      - $ref: "#/components/schemas/TermFair"
    TermRegex:
      additionalProperties: false
      description: Term encoded as a regular expression pattern.
      example:
        type: regex
        value: "(abc|de|fg){2,}"
      properties:
        type:
          enum:
          - regex
          type: string
        value:
          description: Regular expression pattern.
          type: string
      required:
      - type
      - value
      type: object
    TermFairMetadata:
      description: Metadata describing properties of a FAIR automaton.
      properties:
        deterministic:
          description: Whether this FAIR encodes a deterministic automaton. Only a
            deterministic FAIR guarantees consistent string ordering across paginated
            /generate/strings requests; call /compute/determinize first if this is
            false.
          type: boolean
      readOnly: true
      type: object
    TermFair:
      additionalProperties: false
      description: "Term encoded as FAIR (Fast Automaton Internal Representation),\
        \ a stable, signed format used internally by the engine."
      example:
        type: fair
        value: "<uw$8AJYkaU].HFn1kT[tx*-VAZ8usSKXcEKZ[wx:F8vYuR-b?tFFk1eM2RXs9yuu5dakz7r/{!AW9/(hK0]knHS&Q]!@K=ahmGr1Dbjb5(XE1UT%Ab@8rXvYop}$"
        metadata:
          deterministic: true
      properties:
        type:
          enum:
          - fair
          type: string
        value:
          description: FAIR payload.
          type: string
        metadata:
          allOf:
          - $ref: "#/components/schemas/TermFairMetadata"
          readOnly: true
      required:
      - type
      - value
      type: object
    TwoTermsRequest:
      description: Request carrying exactly 2 terms.
      properties:
        terms:
          description: Exactly 2 terms.
          items:
            $ref: "#/components/schemas/Term"
          maxItems: 2
          minItems: 2
          type: array
        options:
          $ref: "#/components/schemas/RequestOptions"
      required:
      - terms
      type: object
    cardinality_200_response:
      example:
        data:
          type: infinite
        success: true
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Cardinality"
      required:
      - data
      - success
      type: object
    dot_200_response:
      example:
        data:
          type: string
          value: value
        success: true
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/String"
      required:
      - data
      - success
      type: object
    empty_200_response:
      example:
        data:
          type: boolean
          value: true
        success: true
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Boolean"
      required:
      - data
      - success
      type: object
    length_200_response:
      example:
        data:
          min: 0
          max: 6
          type: length
        success: true
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Length"
      required:
      - data
      - success
      type: object
    concat_200_response:
      example:
        data:
          type: regex
          value: "(abc|de|fg){2,}"
        success: true
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/Term"
      required:
      - data
      - success
      type: object
    strings_200_response:
      example:
        data:
          strings: ""
          type: generatedStrings
        success: true
      properties:
        success:
          type: boolean
        data:
          $ref: "#/components/schemas/GenerateStringsResponse"
      required:
      - data
      - success
      type: object
  securitySchemes:
    BearerAuth:
      bearerFormat: JWT
      scheme: bearer
      type: http

