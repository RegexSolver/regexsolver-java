            schema:
              $ref: "#/components/schemas/TermRequest"
        required: true
      responses:
        "200":
          content:
            application/json:
              example:
                success: true
                data:
                  type: regex
                  value: "[^a]*"
              schema:
                $ref: "#/components/schemas/concat_200_response"
          description: Complemented term.
        "400":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse400"
          description: Bad request
        "401":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse401"
          description: Unauthorized
        "403":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse403"
          description: Forbidden
        "404":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
          description: Not found
        "429":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
